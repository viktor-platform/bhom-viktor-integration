[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "viktor-bhom-lca-service"
version = "1.0.0"
description = "VIKTOR worker service for BHoM life-cycle assessment"
requires-python = ">=3.13,<3.14"
dependencies = [
  "viktor>=14.30,<15",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "jsonschema>=4.23,<5",
  "referencing>=0.36,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["lca_service*"]
