[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "viktor-bhom-revit-connector-sample"
version = "0.1.0"
description = "VIKTOR sample producer for Revit 2025 BHoM snapshots and LCA handoff"
requires-python = ">=3.13,<3.14"
dependencies = [
  "viktor>=14.30,<15",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["app*"]
