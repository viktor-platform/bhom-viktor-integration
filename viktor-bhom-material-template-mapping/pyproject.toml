[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "viktor-bhom-material-template-mapping"
version = "0.1.0"
description = "Review Revit takeoffs and generate BHoM LCA material templates"
requires-python = ">=3.13,<3.14"
dependencies = [
  "openpyxl>=3.1,<4",
  "viktor>=14.30,<15",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*.json", "templates/*.html"]
